<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/media_query.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="image">
                <!-- image in the css -->
            </div>
            <div id="form">
                <h1>Login</h1> <hr>
                <p>Welcome! Login to access your account and configurate your environment bellow.</p> <hr>
                <form action="login.php" method="post" autocomplete="on">
                    <div class="field">
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="login" id="i_login" placeholder="seu email" autocomplete="email" required minlength="15" maxlength="30">
                        <label for="i_login">Login</label>
                    </div>
                    <div class="field">
                        <span class="material-symbols-outlined">key</span>
                        <input type="password" name="password" id="i_password" placeholder="sua senha" autocomplete="current-password" required minlength="8" maxlength="15">
                        <label for="i_password">Senha</label>
                    </div>
                    <input type="submit" value="Log-in">
                    <a href="forgot.html">esqueci a senha
                        <span class="material-symbols-outlined">help</span>
                    </a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
